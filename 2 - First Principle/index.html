<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Navbar Example</title>
  <style>
    /* Reset margins and padding */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
    }

    /* Navbar main container layout */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 1rem 2rem;
    }

    /* Logo link text styling */
    .nav-logo a {
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
      text-decoration: none;
    }

    /* Inline list structure for links */
    .nav-links {
      display: flex;
      list-style: none;
      gap: 1.5rem;
    }

    /* Individual navigation links */
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      transition: color 0.3s ease;
    }

    /* Hover interactive feedback color */
    .nav-links a:hover {
      color: #00bcd4;
    }

    /* Main body landing layout placeholder */
    .content {
      padding: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar Start -->
  <nav class="navbar">
    <div class="nav-logo">
      <a href="#">MyWebsite</a>
    </div>
    <ul class="nav-links">
      <li><a href="/home">Home</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/services">Services</a></li>
      <li><a href="/contact">Contact</a></li>
    </ul>
  </nav>
  <!-- Navigation Bar End -->

  <!-- Page Content Placeholder -->
  <main class="content">
    <h1>Welcome to My Website</h1>
    <p>My Website</p>
  </main>

</body>
</html>
